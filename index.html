<section class="hg-advent" lang="ru" data-year="2026" aria-label="Адвент-календарь Хогсмида">
<!-- НАСТРОЙКИ. Год календаря меняется в data-year строкой выше.
     Здесь можно редактировать названия (title), задания (task) и награды (reward).
     Номер day соответствует дню декабря. -->
<script type="application/json" class="hg-stories">
[
  {"day":1, "title":"Сова на пороге", "task":"Вам доставили конверт с обратным адресом «Хогсмид, дом у фонаря». Напишите первые две строки письма, которое ваш персонаж отправит в ответ.", "reward":"Подарок"},
  {"day":2, "title":"Шарф с характером", "task":"Придумайте для вязаного шарфа одно полезное заклятие и одну забавную причуду, о которой продавец забыл предупредить.", "reward":"Переброс кубика"},
  {"day":3, "title":"Заказ в «Трёх мётлах»", "task":"Мадам Розмерта добавляет в меню зимний напиток. Дайте ему название и назовите два ингредиента, по которым завсегдатаи узнают его с первого глотка.", "reward":"Бесплатный пазл"},
  {"day":4, "title":"Бюро находок", "task":"У чайной лавки нашли зачарованную варежку. Составьте объявление и укажите две приметы, по которым хозяин узнает пропажу.", "reward":"Подарок"},
  {"day":5, "title":"Снег в чернильнице", "task":"В пере осталось ровно семь слов. Напишите ими записку соседу по Хогсмиду и обязательно используйте слово «метель».", "reward":"Уникальный фон"},
  {"day":6, "title":"Странный след", "task":"Утром цепочка следов на снегу обрывается у вашей двери. В двух предложениях расскажите, кто приходил и зачем.", "reward":"Подарок"},
  {"day":7, "title":"Дежурный фонарь", "task":"Фонарь у совиной почты загорается от добрых слов. Оставьте короткое пожелание кому-нибудь из жителей деревни, чтобы почтальон нашёл дорогу домой.", "reward":"Аватар от Уиспера"},
  {"day":8, "title":"Сладость с секретом", "task":"Придумайте конфету для «Сладкого королевства». Как она называется и что происходит с тем, кто откусит первый кусочек?", "reward":"Подарок"},
  {"day":9, "title":"Ключ с крылышками", "task":"Ночью в окно постучался крошечный ключ. Какую дверь он открывает и что прячется за ней? Уложитесь в две фразы.", "reward":"Переброс кубика"},
  {"day":10, "title":"Вывеска под снегом", "task":"Назовите зимнюю лавку своего персонажа и придумайте для её вывески одну строчку, из-за которой прохожий свернёт с дороги.", "reward":"Бесплатный пазл"},
  {"day":11, "title":"Прогноз из Хогсмида", "task":"Передайте завтрашний прогноз по волшебному радио. Какое необычное явление ждёт деревню и что слушателям стоит взять с собой?", "reward":"Подарок"},
  {"day":12, "title":"Лёд с почерком", "task":"После первого круга на коньках за вашим персонажем проступает надпись на льду. Напишите её и назовите того, кому она адресована.", "reward":"Уникальный фон"},
  {"day":13, "title":"Зелье для варежек", "task":"В котелке у аптекаря варится зелье для промёрзших варежек. Придумайте его цвет, запах и один неожиданный побочный эффект.", "reward":"Переброс кубика"},
  {"day":14, "title":"У камина", "task":"Какое зимнее воспоминание возвращается к вашему персонажу вместе с запахом еловых дров? Расскажите о нём двумя фразами от первого лица.", "reward":"Подарок"},
  {"day":15, "title":"Морозная оранжерея", "task":"В саду за гостиницей на морозе распустился цветок. Дайте ему имя и объясните, почему хозяин никогда не заносит его в тепло.", "reward":"Аватар от Уиспера"},
  {"day":16, "title":"Запоздалая посылка", "task":"Из коробки с пометкой «Не щекотать!» доносится шорох. Напишите, что в ней лежит и кому предназначалась посылка.", "reward":"Бесплатный пазл"},
  {"day":17, "title":"Угадай волшебника", "task":"Загадайте персонажа форума и положите на прилавок три вещи, по которым его узнают другие игроки. Перечислите их, сохранив имя в тайне.", "reward":"Подарок"},
  {"day":18, "title":"Тихая витрина", "task":"Опишите одним предложением отражение в витрине Хогсмида. Вплетите в него три слова — «стекло», «свеча» и «след».", "reward":"Переброс кубика"},
  {"day":19, "title":"Танцы на коньках", "task":"Ваши коньки сами заказали музыку для катка. Какую мелодию они выбрали и каким движением персонаж открыл танец?", "reward":"Уникальный фон"},
  {"day":20, "title":"Карманный дракон", "task":"Дракончик устроился греться в вашей муфте. Как вы назовёте малыша и чем уговорите его перебраться в тёплый домик?", "reward":"Подарок"},
  {"day":21, "title":"Телеграмма на станцию", "task":"Друг опаздывает на последний поезд. Отправьте ему телеграмму с запасным планом. Сова согласилась запомнить не больше десяти слов.", "reward":"Бесплатный пазл"},
  {"day":22, "title":"Забытый куплет", "task":"Сочините две строки для зимней песенки, которую студенты напевают по дороге из Хогсмида в замок.", "reward":"Переброс кубика"},
  {"day":23, "title":"Тайный даритель", "task":"Выберите подарок для другого персонажа и приложите одну подсказку, по которой получатель сможет угадать дарителя.", "reward":"Подарок"},
  {"day":24, "title":"Окно в сочельник", "task":"Зачарованное зеркало показывает один вечер из прошлого. Какой вечер захочет увидеть ваш персонаж и какую деталь заметит первой?", "reward":"Аватар от Уиспера"},
  {"day":25, "title":"Последняя страница", "task":"Оставьте две строки в гостевой книге Хогсмида от лица персонажа. Что он увозит с собой и к кому обещает вернуться следующей зимой?", "reward":"Уникальный фон"}
]
</script>
<style>
.hg-advent{--ink:#263751;--muted:#465875;--serif:"Playfair Display",Georgia,"Times New Roman",serif;--sans:"Inter","Source Sans 3",Arial,sans-serif;box-sizing:border-box;width:100%;max-width:968px;min-width:0;margin:0 auto;border:1px solid #bcc6d5;border-radius:16px;overflow:hidden;isolation:isolate;container:hg-calendar / inline-size;background:#f3f5f9;color:var(--ink);color-scheme:light;font:400 15px/1.5 var(--sans);text-align:left;letter-spacing:normal;}
.hg-advent *,.hg-advent *::before,.hg-advent *::after{box-sizing:border-box;}
.hg-advent [hidden]{display:none !important;}
.hg-advent:is(h2,h3,p){margin:0;padding:0;border:0;background:none;text-transform:none;}

.hg-advent button:focus-visible,.hg-advent textarea:focus-visible{outline:3px solid #1c6b94;outline-offset:3px;}
.hg-advent .hg-hero{position:relative;display:flex;align-items:center;min-height:266px;padding:35px 6.4% 40px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 76% 57%,#7584aa75,transparent 35%),radial-gradient(ellipse at 91% 3%,#75658e66,transparent 45%),linear-gradient(110deg,#1b2c46 0%,#293d5c 52%,#4c5278 100%);color:#f8f6fa;}
.hg-advent .hg-hero::before{content:"";position:absolute;z-index:-1;inset:0;background-image:radial-gradient(1px 1px at 19px 24px,#e9e2f7 80%,transparent),radial-gradient(1.1px 1.1px at 98px 69px,#c9c7df 80%,transparent),radial-gradient(.8px .8px at 62px 38px,#eae6e4 80%,transparent);background-size:151px 89px,203px 131px,83px 113px;opacity:.56;}
.hg-advent .hg-hero::after{content:"";position:absolute;z-index:-1;inset:auto 0 0;height:58px;background:var(--hg-village) bottom center / 100% 100% no-repeat;opacity:.88;}
.hg-advent .hg-copy{position:relative;z-index:1;max-width:62%;}
.hg-advent .hg-kicker{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:#e0e7f1;font:650 10px/1.3 var(--sans);letter-spacing:.19em;text-transform:uppercase;}

.hg-advent .hg-title{color:#fcf8f4;font:400 clamp(56px,7.7cqi,77px)/.96 var(--serif);letter-spacing:-.044em;}

.hg-advent .hg-dates{display:flex;align-items:center;gap:12px;margin-top:19px;color:#e4e7f0;font:500 13px/1.4 var(--sans);letter-spacing:.04em;}
.hg-advent .hg-dates::before{content:"";width:26px;height:1px;background:#d1b895;}
.hg-advent .hg-orbit{position:absolute;z-index:0;right:6%;top:50%;transform:translateY(-50%);width:36%;height:94%;pointer-events:none;background:radial-gradient(ellipse closest-side,#c8d2f42b,transparent);}
.hg-advent .hg-orbit::before,.hg-advent .hg-orbit::after{content:"";position:absolute;left:50%;top:50%;width:86%;height:76%;transform:translate(-50%,-50%) rotate(-21deg);border:1px solid #d8c7e344;border-radius:50%;}
.hg-advent .hg-orbit::after{width:104%;height:67%;transform:translate(-50%,-50%) rotate(27deg);border-style:dashed;border-color:#ddd6ef3b;}
.hg-advent .hg-globe{position:absolute;z-index:2;inset:1% 9% 0;background:var(--hg-globe) center / contain no-repeat;filter:drop-shadow(0 8px 10px #13213766);}
.hg-advent .hg-star{position:absolute;width:17px;height:23px;background:#e6d3b4;clip-path:polygon(50% 0,59% 38%,100% 50%,59% 59%,50% 100%,42% 59%,0 50%,42% 40%);}
.hg-advent .hg-star:nth-of-type(1){top:14%;left:15%;}
.hg-advent .hg-star:nth-of-type(2){top:60%;right:-1%;width:11px;height:17px;background:#dedcf5;}
.hg-advent .hg-star:nth-of-type(3){bottom:10%;left:6%;width:7px;height:11px;}
.hg-advent .hg-main{padding:0 clamp(12px,3cqi,30px) 0;}
.hg-advent .hg-status{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:14px;padding:23px 1px 21px;}
.hg-advent .hg-clock{width:38px;height:38px;border:1px solid #b7c4d5;border-radius:50%;display:grid;place-items:center;background:#e6ebf3;color:#47607c;}
.hg-advent .hg-clock i{display:block;position:relative;width:16px;height:16px;border:1.3px solid currentColor;border-radius:50%;}
.hg-advent .hg-clock i::before{content:"";position:absolute;top:2px;left:6px;width:5px;height:6px;border-left:1.3px solid;border-bottom:1.3px solid;transform:skewY(15deg);}
.hg-advent .hg-status-title{color:var(--ink);font:600 clamp(18px,2.5cqi,23px)/1.18 var(--serif);letter-spacing:-.02em;}
.hg-advent .hg-status-note{margin-top:4px;color:var(--muted);font:400 13px/1.43 var(--sans);}
.hg-advent .hg-jump{display:inline-block;padding:0 0 1px;border:0;border-bottom:1px solid #597093;border-radius:0;background:none;color:#365578;font:650 13px/1.3 var(--sans);}
.hg-advent .hg-count{padding-left:17px;border-left:1px solid #c7d0de;text-align:right;color:#43536c;}
.hg-advent .hg-count-label{display:block;font:600 10px/1.35 var(--sans);text-transform:uppercase;letter-spacing:.09em;}
.hg-advent .hg-time{display:block;margin-top:3px;color:#293d5c;font:550 17px/1.2 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap;}
.hg-advent .hg-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:clamp(80px,10.5cqi,102px);gap:8px;grid-template-areas:"d1 d1 d2 d3 d4 d4" "d1 d1 d5 d5 d6 d7" "d8 d9 d9 d10 d11 d7" "d12 d12 d13 d14 d15 d15" "d16 d17 d13 d18 d18 d19" "d20 d21 d21 d22 d23 d19" "d24 d24 d25 d25 d25 d25";}
.hg-advent .hg-door{--base:#dce6ed;--wash:#eff2f6;--fg:#324b60;--rule:#869aaf80;--glaze:#fff2;position:relative;display:block;isolation:isolate;container-type:size;min-width:0;min-height:0;width:100%;height:100%;padding:0;overflow:hidden;text-align:left;border:1px solid var(--rule);border-radius:7px;background:radial-gradient(ellipse at 67% 80%,var(--glaze),transparent 65%),linear-gradient(120deg,var(--wash),var(--base));color:var(--fg);opacity:1;}
.hg-advent .hg-door:disabled{opacity:1;cursor:default;-webkit-text-fill-color:currentColor;}
.hg-advent .hg-door[data-tone="navy"]{--base:#354c70;--wash:#202f4a;--fg:#f2f4ff;--rule:#aebedd70;--glaze:#bac8ff13;}
.hg-advent .hg-door[data-tone="lilac"]{--base:#d9cce9;--wash:#e9e4f3;--fg:#55466c;--rule:#a293b69c;}
.hg-advent .hg-door[data-tone="aqua"]{--base:#bfdcd9;--wash:#e1eeeb;--fg:#2c5157;--rule:#809e9d90;}
.hg-advent .hg-door[data-tone="plum"]{--base:#625775;--wash:#473e5e;--fg:#f7f0ff;--rule:#c9bbdf88;--glaze:#d6c1ff1c;}
.hg-advent .hg-door[data-tone="blue"]{--base:#c3d8ee;--wash:#e3ecf6;--fg:#304866;--rule:#8fa3ba99;}
.hg-advent .hg-door[data-tone="pearl"]{--base:#e1dfe4;--wash:#f3eff4;--fg:#535269;--rule:#a9a7b695;}
.hg-advent .hg-door::before{content:"";position:absolute;z-index:2;inset:5px;border:1px solid var(--rule);border-radius:3px;pointer-events:none;}
.hg-advent .hg-door::after{content:"";position:absolute;z-index:-1;inset:0;opacity:.45;background:radial-gradient(1px 1px at 12px 18px,currentColor 70%,transparent 90%),radial-gradient(1px 1px at 32px 41px,currentColor 70%,transparent 90%);background-size:63px 48px,91px 81px;}
.hg-advent .hg-num{position:absolute;z-index:2;top:11px;left:15px;color:inherit;font:400 clamp(30px,min(29cqw,43cqh),58px)/.95 var(--serif);letter-spacing:-.045em;}
.hg-advent .hg-mark{position:absolute;z-index:3;right:13px;top:12px;width:13px;height:15px;opacity:.82;}
.hg-advent .hg-door[data-state="future"] .hg-mark::before,.hg-advent .hg-legend-lock::before{content:"";position:absolute;left:3px;top:1px;width:7px;height:8px;border:1.2px solid;border-radius:5px 5px 0 0;}
.hg-advent .hg-door[data-state="future"] .hg-mark::after,.hg-advent .hg-legend-lock::after{content:"";position:absolute;left:1px;top:7px;width:11px;height:8px;border:1.2px solid;border-radius:2px;background:var(--base,#f3f5f9);}
.hg-advent .hg-art{position:absolute;z-index:1;right:9px;bottom:8px;width:min(66cqw,88cqh,174px);aspect-ratio:1;background-image:var(--hg-icons);background-size:400% 300%;background-repeat:no-repeat;filter:drop-shadow(0 3px 3px #24354e28);pointer-events:none;}
.hg-advent .hg-flake{position:absolute;right:8%;bottom:3%;color:inherit;opacity:.20;font:400 min(41cqw,64cqh)/1 Georgia,"DejaVu Sans",serif;transform:rotate(14deg);}
.hg-advent .hg-flake::before{content:"❄︎";}
.hg-advent .hg-door[data-print="diamonds"]::after{background:repeating-linear-gradient(48deg,transparent 0 12px,var(--rule) 12px 13px,transparent 13px 28px),repeating-linear-gradient(-48deg,transparent 0 12px,var(--rule) 12px 13px,transparent 13px 28px);opacity:.33;}
.hg-advent .hg-door[data-print="stripes"]::after{background:repeating-linear-gradient(-48deg,transparent 0 17px,var(--rule) 17px 18px,transparent 18px 21px,var(--rule) 21px 22px);opacity:.32;}

.hg-advent .hg-door[data-state="past"] .hg-mark::after,.hg-advent .hg-legend-past::after{content:"";position:absolute;top:7px;left:2px;width:10px;height:1.5px;background:currentColor;}
.hg-advent .hg-door[data-state="today"]{--base:#f1d4a0;--wash:#fff5dc;--fg:#533916;--rule:#967037;--glaze:#fffae9;border:2px solid #9a6e30;box-shadow:inset 0 0 15px #f7dba5;cursor:pointer;}

.hg-advent .hg-door[data-state="today"] .hg-mark::after,.hg-advent .hg-legend-today::after{content:"✦";position:absolute;inset:0;color:#8b611f;font:17px/1 Georgia,serif;}
.hg-advent .hg-open-word{position:absolute;z-index:3;bottom:11px;left:12px;padding:2px 6px;border-radius:4px;background:#fff1ce;color:#62431c;font:700 11px/1.3 var(--sans);}

.hg-advent .hg-orbit{width:35%;right:5%;height:80%;}
.hg-advent .hg-status{grid-template-columns:minmax(0,1fr) auto;gap:12px;padding-block:17px;}
.hg-advent .hg-clock{display:none;}
}
@container hg-calendar (max-width:425px){.hg-advent .hg-grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:clamp(70px,21cqi,85px);gap:6px;grid-template-areas:"d1 d1 d2" "d1 d1 d3" "d4 d5 d5" "d6 d7 d8" "d9 d7 d10" "d11 d12 d12" "d13 d14 d15" "d13 d16 d17" "d18 d18 d19" "d20 d21 d19" "d22 d23 d24" "d25 d25 d25";}
.hg-advent .hg-hero{min-height:187px;padding:23px 5% 28px;}
.hg-advent .hg-title{font-size:clamp(34px,10.6cqi,45px);}
.hg-advent .hg-kicker{gap:5px;margin-bottom:12px;font-size:8px;letter-spacing:.11em;}
.hg-advent .hg-kicker::before{font-size:12px;}
.hg-advent .hg-dates{margin-top:14px;font-size:11px;gap:7px;}

.hg-advent .hg-orbit{right:3%;width:35%;height:76%;}

</style>
<header class="hg-hero">
  <div class="hg-copy">
    <div class="hg-kicker">Адвент-календарь</div>
    <h2 class="hg-title">Декабрь <em>в Хогсмиде</em></h2>
    <p class="hg-dates">1–25 декабря <span class="hg-year"></span></p>
  </div>
  <div class="hg-orbit" aria-hidden="true"><i class="hg-star"></i><i class="hg-star"></i><i class="hg-star"></i><span class="hg-globe"></span></div>
</header>
<div class="hg-main">
  <div class="hg-status">
    <span class="hg-clock" aria-hidden="true"><i></i></span>
    <div>
      <p class="hg-status-title" role="status">Зимние задания Хогсмида</p>
      <p class="hg-status-note"><span class="hg-status-desc">Одно окошко каждый день в 00:00 по Москве.</span> <button type="button" class="hg-jump" hidden>Открыть задание</button></p>
    </div>
    <div class="hg-count" hidden><span class="hg-count-label"></span><span class="hg-time" role="timer" aria-live="off"></span></div>
  </div>
  <section class="hg-letter" aria-label="Задание и награда" hidden>
    <button type="button" class="hg-close" aria-label="Закрыть задание">×</button>
    <p class="hg-letter-date"></p>
    <h3 tabindex="-1"></h3>
    <p class="hg-task"></p>
    <p class="hg-gift"><span class="hg-gift-label">Награда</span><strong></strong></p>
    <div class="hg-letter-foot">
      <button type="button" class="hg-copy-btn">Скопировать бланк</button>
      <span class="hg-instruction">Вставьте бланк в ответ этой темы и допишите свой вариант.</span>
    </div>
    <p class="hg-feedback" role="status"></p>
    <textarea class="hg-manual" rows="3" aria-label="Бланк ответа для копирования" readonly hidden></textarea>
  </section>
  <noscript><p>Включите JavaScript, чтобы окошки открывались по московскому времени.</p></noscript>
  <div class="hg-grid" role="group" aria-label="Окошки с 1 по 25 декабря"></div>
  <div class="hg-legend" aria-label="Обозначения">
    <span><i class="hg-legend-lock" aria-hidden="true"></i>Ещё закрыто</span>
    <span><i class="hg-legend-today" aria-hidden="true"></i>Открыто сегодня</span>
    <span><i class="hg-legend-past" aria-hidden="true"></i>День прошёл</span>
  </div>
</div>
<script>
(function () {
  "use strict";
  function mount(root) {
    if (root.dataset.hgReady) return;
    root.dataset.hgReady = "1";
    const find = selector => root.querySelector(selector);
    const year = Number(root.dataset.year);
    const dayMs = 86400000;
    // Декабрьская полночь по Москве — UTC+3.
    const starts = Date.parse(year + "-12-01T00:00:00+03:00");
    const ends = starts + 25 * dayMs;
    const status = find(".hg-status-title");
    let stories;
    try {
      stories = new Map(JSON.parse(find(".hg-stories").textContent).map(item => [item.day, item]));
      if (!Number.isFinite(starts) || !Array.from({length:25}, (_, i) => i + 1).every(d => stories.has(d))) throw new Error();
    } catch (_) {
      status.textContent = "Проверьте год и список из 25 заданий в настройках календаря.";
      return;
    }
    find(".hg-year").textContent = year;

    const grid = find(".hg-grid");
    const letter = find(".hg-letter");
    const heading = find(".hg-letter h3");
    const jump = find(".hg-jump");
    const counter = find(".hg-count");
    const timerText = find(".hg-time");
    const feedback = find(".hg-feedback");
    const manual = find(".hg-manual");
    const close = find(".hg-close");
    const copy = find(".hg-copy-btn");
    let letterId = "hg-advent-letter";
    while (document.getElementById(letterId)) letterId += "-x";
    letter.id = letterId;
    jump.setAttribute("aria-controls", letterId);
    status.tabIndex = -1;

    // Цвет и рисунок каждой дверцы. Цифра — положение иллюстрации на общем листе.
    const looks = [
      ["navy",0], ["lilac","snow"], ["aqua","diamonds"], ["blue",1], ["plum",2],
      ["pearl","stars"], ["navy",3], ["lilac","stripes"], ["aqua",4], ["blue","snow"],
      ["pearl","diamonds"], ["blue","snow"], ["plum",5], ["aqua","stars"], ["lilac",6],
      ["pearl","stripes"], ["navy","diamonds"], ["blue",11], ["lilac",7], ["blue",9],
      ["aqua",2], ["plum","stars"], ["pearl","snow"], ["lilac",8], ["navy",10]
    ];
    function decoration(className, value) {
      const node = document.createElement("span");
      node.className = className;
      node.setAttribute("aria-hidden", "true");
      if (value) node.textContent = value;
      return node;
    }
    const doors = looks.map(([tone, ornament], index) => {
      const day = index + 1;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "hg-door";
      button.disabled = true;
      button.dataset.day = day;
      button.dataset.tone = tone;
      button.style.gridArea = "d" + day;
      button.setAttribute("aria-controls", letterId);
      if (typeof ornament === "number") {
        const art = decoration("hg-art");
        art.style.backgroundPosition = ((ornament % 4) * 100 / 3) + "% " + (Math.floor(ornament / 4) * 50) + "%";
        button.append(art);
      } else {
        button.dataset.print = ornament;
        button.append(decoration("hg-flake"));
      }
      button.append(decoration("hg-num", String(day).padStart(2, "0")), decoration("hg-mark"));
      const word = decoration("hg-open-word", "Открыть");
      word.hidden = true;
      button.append(word);
      grid.append(button);
      return button;
    });

    let serverClock = null;
    function readClock() {
      return serverClock ? serverClock.stamp + Math.floor(performance.now() - serverClock.mark) : Date.now();
    }
    const now = readClock;
    function dayAt(time) {
      if (time < starts) return 0;
      if (time >= ends) return 26;
      return Math.floor((time - starts) / dayMs) + 1;
    }
    let lastClockCheck = -Infinity;
    async function syncForumClock() {
      // Сверяем время со страницей календаря по HTTP-заголовку Date.
      // Локальный файл и изолированный фрейм используют часы устройства.
      const checkedAt = Date.now();
      if (Math.abs(checkedAt - lastClockCheck) < 60000) return;
      lastClockCheck = checkedAt;
      try {
        const site = new URL(document.baseURI);
        if (!/^https?:$/.test(site.protocol) || site.origin !== window.origin) return;
        const response = await fetch(site, {method:"HEAD", mode:"same-origin", cache:"no-store"});
        const stamp = Date.parse(response.headers.get("Date") || "");
        if (checkedAt === lastClockCheck && response.ok && Number.isFinite(stamp) && !(Number(response.headers.get("Age")) > 0)) {
          serverClock = {stamp, mark:performance.now()};
          refresh();
        }
      } catch (_) { /* Часы устройства уже работают. */ }
    }
    let phase = null;
    let openDay = 0;
    let opener = null;
    let timeout;
    const isLive = day => day >= 1 && day <= 25;
    const pad = value => String(value).padStart(2, "0");

    function fold(restoreFocus) {
      const previous = openDay;
      openDay = 0;
      letter.hidden = true;
      manual.hidden = true;
      manual.value = "";
      feedback.textContent = "";
      jump.textContent = "Открыть задание";
      jump.setAttribute("aria-expanded", "false");
      if (previous) doors[previous - 1].setAttribute("aria-expanded", "false");
      if (restoreFocus && opener && !opener.disabled && !opener.hidden) opener.focus();
      opener = null;
    }
    function changeDay(day) {
      const moveFocus = letter.contains(document.activeElement) || grid.contains(document.activeElement) || document.activeElement === jump;
      fold(false);
      phase = day;
      const live = isLive(day);
      jump.hidden = !live;
      counter.hidden = day === 26;
      const description = find(".hg-status-desc");
      if (day === 0) {
        status.textContent = "Первое окошко откроется 1 декабря";
        description.textContent = "Каждое задание доступно сутки, с полуночи по Москве.";
        find(".hg-count-label").textContent = "До открытия";
      } else if (live) {
        status.textContent = "Сегодня открыто окошко № " + day;
        description.textContent = "Ответы принимаются до полуночи по Москве.";
        find(".hg-count-label").textContent = "До закрытия";
      } else {
        status.textContent = "Все 25 окошек закрыты";
        description.textContent = "Приём ответов завершился 26 декабря " + year + " года в 00:00 по Москве.";
      }
      doors.forEach((door, i) => {
        const n = i + 1;
        const state = n < day ? "past" : n === day ? "today" : "future";
        const label = {past:"день прошёл", today:"открыть задание", future:"ещё закрыто"}[state];
        door.dataset.state = state;
        door.disabled = state !== "today";
        door.querySelector(".hg-open-word").hidden = door.disabled;
        door.setAttribute("aria-label", n + " декабря, " + label);
        if (door.disabled) {
          door.removeAttribute("aria-current");
          door.removeAttribute("aria-expanded");
        } else {
          door.setAttribute("aria-current", "date");
          door.setAttribute("aria-expanded", "false");
        }
      });
      if (moveFocus) (live ? jump : status).focus({preventScroll:true});
    }
    function refresh() {
      clearTimeout(timeout);
      if (!root.isConnected) return;
      const time = now();
      const day = dayAt(time);
      if (phase !== day) changeDay(day);
      if (day === 26) return;
      const deadline = day === 0 ? starts : starts + day * dayMs;
      let seconds = Math.ceil((deadline - time) / 1000);
      const days = day === 0 ? Math.floor(seconds / 86400) : 0;
      seconds -= days * 86400;
      timerText.textContent = (days ? days + " д " : "") + pad(Math.floor(seconds / 3600)) + ":" + pad(Math.floor(seconds / 60) % 60) + ":" + pad(seconds % 60);
      if (!document.hidden) timeout = setTimeout(refresh, 1000 - (time % 1000));
    }
    function reveal(day, trigger) {
      refresh();
      if (!isLive(day) || day !== phase) return;
      if (openDay === day) { fold(true); return; }
      const item = stories.get(day);
      openDay = day;
      opener = trigger;
      find(".hg-letter-date").textContent = day + " декабря · Задание дня";
      heading.textContent = item.title;
      find(".hg-task").textContent = item.task;
      find(".hg-gift strong").textContent = item.reward;
      letter.hidden = false;
      jump.textContent = "Свернуть задание";
      jump.setAttribute("aria-expanded", "true");
      doors[day - 1].setAttribute("aria-expanded", "true");
      heading.focus({preventScroll:true});
      letter.scrollIntoView({block:"nearest", behavior:"auto"});
    }
    grid.addEventListener("click", event => {
      const door = event.target.closest(".hg-door");
      if (door) reveal(Number(door.dataset.day), door);
    });
    jump.addEventListener("click", () => { refresh(); reveal(phase, jump); });
    close.addEventListener("click", () => fold(true));
    root.addEventListener("keydown", event => {
      if (event.key === "Escape" && openDay) { event.preventDefault(); fold(true); }
    });
    copy.addEventListener("click", async () => {
      refresh();
      const day = openDay;
      if (!isLive(day) || day !== phase) return;
      const item = stories.get(day);
      const blank = "[b]Адвент в Хогсмиде · " + day + " декабря " + year + "[/b]\n[i]" + item.title + "[/i]\nМой ответ: ";
      try {
        await navigator.clipboard.writeText(blank);
        refresh();
        if (openDay === day) feedback.textContent = "Бланк скопирован.";
      } catch (_) {
        refresh();
        if (openDay !== day) return;
        manual.value = blank;
        manual.hidden = false;
        manual.focus();
        manual.select();
        feedback.textContent = "Скопируйте выделенный бланк и вставьте его в сообщение.";
      }
    });
    function wake() {
      refresh();
      if (!document.hidden && root.isConnected) syncForumClock();
    }
    document.addEventListener("visibilitychange", wake);
    window.addEventListener("pageshow", wake);
    window.addEventListener("focus", wake);
    wake();
  }
  document.querySelectorAll(".hg-advent").forEach(mount);
}());
</script>
